[project]
name = "django-model-rag"
version = "0.1.0"
description = "Discover and normalize text content from any Django model, ready for a RAG pipeline."
readme = "README.md"
authors = [
    { name = "Olivier Charvoz" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --ds rather than DJANGO_SETTINGS_MODULE: an exported variable of that name
# (from another project's shell) would take precedence over the ini option.
addopts = ["--ds=tests.settings"]
# Makes the `tests` package (settings, test app) importable before collection.
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "DJ",
    "C90",  # function complexity
    "N",    # PEP 8 naming
    "SIM",  # simplifications
    "RET",  # return statements
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "PL",   # pylint, including PLR2004 (magic values)
]

[tool.ruff.lint.pylint]
# Magic values: flag strings too, not only numbers (the default allows
# "str" and "bytes").
allow-magic-value-types = []

[tool.ruff.lint.per-file-ignores]
# Fixtures copied from the prototype: some models have no __str__ on purpose.
"tests/testapp/models.py" = ["DJ008"]
# Literal examples are what tests are made of.
"tests/**" = ["PLR2004"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# Generated by makemigrations, never edited by hand.
module = "tests.testapp.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"
