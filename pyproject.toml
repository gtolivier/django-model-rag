[project]
name = "django-model-rag"
version = "0.1.0"
description = "Discover and normalize text content from any Django model, ready for a RAG pipeline."
readme = "README.md"
authors = [
    { name = "Olivier Charvoz" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
