[project]
name = "django-model-rag"
version = "0.1.0"
description = "Discover and normalize text content from any Django model, ready for a RAG pipeline."
readme = "README.md"
authors = [
    { name = "Olivier Charvoz" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --ds rather than DJANGO_SETTINGS_MODULE: an exported variable of that name
# (from another project's shell) would take precedence over the ini option.
addopts = ["--ds=tests.settings"]
# Makes the `tests` package (settings, test app) importable before collection.
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Fixtures copied from the prototype: some models have no __str__ on purpose.
"tests/testapp/models.py" = ["DJ008"]
