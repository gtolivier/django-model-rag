name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags (no @v10): pin the full version.
      - uses: astral-sh/setup-uv@v10.2.0
      # ruff only: neither the project nor its runtime dependencies.
      - run: uv run --locked --only-group dev ruff check
      - run: uv run --locked --only-group dev ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Explicit, so the result does not follow the runner image. The
          # newest Python resolves the newest Django, matching django-stubs;
          # mypy itself targets 3.11 (python_version in pyproject.toml).
          python-version: "3.14"
          enable-cache: true
      - run: uv run --locked --group typecheck mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Boundaries only: oldest and newest supported Python for each
        # supported Django series. Django 5.2 also supports 3.10, but this
        # package requires 3.11+ (3.10 reaches end of life in October 2026).
        include:
          - { django: "5.2", python: "3.11" }
          - { django: "5.2", python: "3.14" }
          - { django: "6.0", python: "3.12" }
          - { django: "6.0", python: "3.14" }
          - { django: "6.1", python: "3.12" }
          - { django: "6.1", python: "3.14" }
    name: test (django ${{ matrix.django }}, python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install "django~=${{ matrix.django }}.0"
      - run: uv run --no-sync pytest
